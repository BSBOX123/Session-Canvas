appId: com.sessioncanvas.app
productName: Session Canvas
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,SPEC.md,HANDOVER.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # SPEC 2.2: local builds only, no signing or notarization.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
